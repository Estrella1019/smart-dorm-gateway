<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>宿舍网关</title>
<style>body{font:16px system-ui;background:#f2f5fa;color:#182839;max-width:1000px;margin:40px auto;padding:20px}article{background:white;border-radius:12px;padding:20px;margin:16px 0}button{padding:10px;margin:5px}pre{white-space:pre-wrap}#connection{padding:12px;background:#dce9ff}</style>
<h1>智能宿舍控制台</h1><p id="connection">连接中</p><main id="devices"></main><h2>操作结果</h2><pre id="result">尚未提交命令</pre>
<script>
const connection=document.querySelector('#connection'),list=document.querySelector('#devices'),result=document.querySelector('#result');let connected=false,pending=new Set();
function render(devices){list.replaceChildren();if(!devices.length)list.textContent='暂无已连接设备';for(const d of devices){const card=document.createElement('article'),title=document.createElement('h2'),state=document.createElement('pre');title.textContent=d.device_id+' · '+(d.online?'在线':'离线');state.textContent=JSON.stringify(d.state,null,2)+'\n最后上报：'+d.last_seen;card.append(title,state);let action=d.device_type==='light'?'set_power':['lock','door_lock'].includes(d.device_type)?'set_locked':null;if(action)for(const value of [true,false]){const b=document.createElement('button');b.textContent=action==='set_power'?(value?'开灯':'关灯'):(value?'上锁':'解锁');b.disabled=!connected||!d.online||pending.has(d.device_id);b.onclick=async()=>{pending.add(d.device_id);card.querySelectorAll('button').forEach(x=>x.disabled=true);result.textContent='执行中，等待设备确认…';try{const r=await fetch('/api/devices/'+encodeURIComponent(d.device_id)+'/commands',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,value})});const data=await r.json();result.textContent=data.status==='success'?'执行成功':data.status==='unknown'?'超时或连接中断，结果未知；请核对设备状态':JSON.stringify(data);}catch(e){result.textContent='连接中断，结果未知';}finally{pending.delete(d.device_id);refresh();}};card.append(b);}list.append(card);}}
async function refresh(){try{const r=await fetch('/api/devices');if(r.ok)render((await r.json()).devices);}catch(e){connection.textContent='无法获取设备列表';}}
function connect(){const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');ws.onopen=()=>{connected=true;connection.textContent='实时连接正常';refresh();};ws.onmessage=e=>render(JSON.parse(e.data).devices);ws.onclose=()=>{connected=false;connection.textContent='实时连接断开，正在重连；设备状态可能已过期';list.querySelectorAll('button').forEach(b=>b.disabled=true);setTimeout(connect,2000);};ws.onerror=()=>ws.close();}connect();
</script></html>
