<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Dorm Gateway</title>
<style>body{font:16px system-ui;background:#f2f5fa;color:#182839;max-width:1000px;margin:40px auto;padding:20px}article{background:white;border-radius:12px;padding:20px;margin:16px 0}button{padding:10px;margin:5px}pre{white-space:pre-wrap}#connection{padding:12px;background:#dce9ff}</style>
<h1>Smart Dorm Console</h1><p id="connection">Connecting</p><main id="devices"></main><h2>Command result</h2><pre id="result">No commands submitted</pre>
<script>
const connection=document.querySelector('#connection'),list=document.querySelector('#devices'),result=document.querySelector('#result');let connected=false,pending=new Set();
function render(devices){list.replaceChildren();if(!devices.length)list.textContent='No connected devices';for(const d of devices){const card=document.createElement('article'),title=document.createElement('h2'),state=document.createElement('pre');title.textContent=d.device_id+' · '+(d.online?'Online':'Offline');const v=d.state||{};state.textContent=(d.device_type==='light'?'Light: '+(v.power===true?'On':v.power===false?'Off':'Unknown'):['lock','door_lock'].includes(d.device_type)?'Door lock: '+(v.locked===true?'Locked':v.locked===false?'Unlocked':'Unknown'):d.device_type==='sensor'?'Temperature: '+(v.temperature??'Unknown')+' ℃\nHumidity: '+(v.humidity??'Unknown')+' %':JSON.stringify(v,null,2))+'\nLast seen: '+(d.last_seen||'Unknown');card.append(title,state);let action=d.device_type==='light'?'set_power':['lock','door_lock'].includes(d.device_type)?'set_locked':null;if(action)for(const value of [true,false]){const b=document.createElement('button');b.textContent=action==='set_power'?(value?'Turn on':'Turn off'):(value?'Lock':'Unlock');b.disabled=!connected||!d.online||pending.has(d.device_id);b.onclick=async()=>{pending.add(d.device_id);card.querySelectorAll('button').forEach(x=>x.disabled=true);result.textContent='Executing; waiting for device confirmation...';try{const r=await fetch('/api/devices/'+encodeURIComponent(d.device_id)+'/commands',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,value})});const data=await r.json();result.textContent=d.device_id+': '+(data.status==='success'?'Command succeeded':data.status==='unknown'?'Confirmation timed out or connection lost. Outcome unknown; check device state.':data.status==='failed'?'Command failed: '+(data.reason||'Device rejected the command'):data.error?'Request failed: '+data.error:'Unrecognized response; check device state.');}catch(e){result.textContent='Connection lost; outcome unknown.';}finally{pending.delete(d.device_id);refresh();}};card.append(b);}list.append(card);}}
async function refresh(){try{const r=await fetch('/api/devices');if(r.ok)render((await r.json()).devices);}catch(e){connection.textContent='Unable to fetch devices';}}
function connect(){const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');ws.onopen=()=>{connected=true;connection.textContent='Live connection established';refresh();};ws.onmessage=e=>render(JSON.parse(e.data).devices);ws.onclose=()=>{connected=false;connection.textContent='Live connection lost. Reconnecting; device states may be stale.';list.querySelectorAll('button').forEach(b=>b.disabled=true);setTimeout(connect,2000);};ws.onerror=()=>ws.close();}connect();
</script></html>
